services:
  linguaflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: linguaflow:1.0.0
    container_name: linguaflow
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${WEB_PORT:-5463}:5463"
    init: true
    stop_grace_period: 20s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      INPUT_DIR: /input
      OUTPUT_DIR: /output
      ARGOS_PRELOAD_DIR: /opt/argos-preload
      WEB_HOST: 0.0.0.0
      WEB_PORT: "5463"
      MAX_TASK_WORKERS: ${MAX_TASK_WORKERS:-2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # 宿主机目录全部走环境变量，默认落在仓库内的相对目录（见 .env.example）
      - "${HOST_INPUT_DIR:-./input}:/input:ro"
      - "${HOST_OUTPUT_DIR:-./output}:/output"
      - "./data:/data"
      - "${HOST_PRELOAD_DIR:-./preload}:/opt/argos-preload:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5463/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
